name: Verify

# Cost guard (Oct 2026): this job runs on a GitHub-hosted macOS runner, which
# bills at ~10x Linux. On 2026-10-10 it ran 44 times in one day (~$23 gross).
# - PRs only (the PR run already gated the code; no duplicate run on push to main)
# - docs/design-only changes skip it
# - a newer push to the same PR cancels the older run
# - hard 20-minute cap per run
# Manual run: Actions -> Verify -> Run workflow.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'Legal/**'
      - '*.svg'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip draft PRs: mark the PR "Ready for review" when you want the check.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Pick simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[5-7][^(]*' | xargs)
          echo "Using simulator: $SIM"
          echo "sim=$SIM" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MyAIssistant.xcodeproj \
            -scheme MyAIssistant \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.sim }}" \
            CODE_SIGNING_ALLOWED=NO | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log
          path: build.log
          retention-days: 3
