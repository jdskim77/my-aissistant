name: Verify (fix/baseline-test-failures)

on:
  push:
    branches:
      - fix/baseline-test-failures

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Pick simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[5-7][^(]*' | xargs)
          echo "Using simulator: $SIM"
          echo "sim=$SIM" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MyAIssistant.xcodeproj \
            -scheme MyAIssistant \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.sim }}" \
            CODE_SIGNING_ALLOWED=NO | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log
          path: build.log
